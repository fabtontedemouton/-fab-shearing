
name: FAB SHEARING APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FAB SHEARING APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche du SDK Android..."

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERREUR : sdkmanager introuvable"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.3.stable"
          DEST="$HOME/.local/share/godot/export_templates/$VERSION"

          mkdir -p "$DEST" /tmp/godot-templates

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/godot-templates.tpz

          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates

          SOURCE="$(find /tmp/godot-templates -name android_source.zip -print -quit)"
          DEBUG="$(find /tmp/godot-templates -name android_debug.apk -print -quit)"
          RELEASE="$(find /tmp/godot-templates -name android_release.apk -print -quit)"

          test -s "$SOURCE"
          test -s "$DEBUG"
          test -s "$RELEASE"

          install -m 0644 "$SOURCE" "$DEST/android_source.zip"
          install -m 0644 "$DEBUG" "$DEST/android_debug.apk"
          install -m 0644 "$RELEASE" "$DEST/android_release.apk"

          printf '%s' "$VERSION" > "$DEST/version.txt"

          echo "Templates Android installés :"
          ls -lh "$DEST"

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          test -s project.godot
          test -s export_presets.cfg

          echo "Fichiers du projet :"
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            ! -path "./.godot/*" | sort

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "SDK Android : $ANDROID_HOME"
          echo "Java : $JAVA_HOME"

      - name: Verify Android preset
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'name="Android"' export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg
          grep -q 'com.fabtontedemouton.fabshearing' export_presets.cfg
          grep -q 'architectures/arm64-v8a=true' export_presets.cfg

          echo "Preset Android détecté."

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --editor \
            --path . \
            --import \
            --quit

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build

          echo "Début de l'export Android..."

          godot --headless --verbose \
            --path . \
            --export-debug "Android" build/FAB-SHEARING.apk \
            2>&1 | tee build/export.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo "ECHEC EXPORT GODOT : code $RESULT"
            echo "Diagnostic du journal :"
            grep -i -E "error|warning|android|template|sdk|gradle" \
              build/export.log | tail -100 || true
            exit "$RESULT"
          fi

          if [ ! -s build/FAB-SHEARING.apk ]; then
            echo "ERREUR : APK absent ou vide"
            exit 1
          fi

          echo "APK créé avec succès."
          ls -lh build/FAB-SHEARING.apk

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAB-SHEARING-APK
          path: |
            build/FAB-SHEARING.apk
            build/export.log
          if-no-files-found: warn
          retention-days: 7
          
