
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FAB SHEARING APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Organize project files automatically
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p scenes scripts

          if [ -f main.tscn ]; then
            cp -f main.tscn scenes/main.tscn
          fi

          for file in main.gd sheep.gd player.gd training_score.gd; do
            if [ -f "$file" ]; then
              cp -f "$file" "scripts/$file"
            fi
          done

          if [ -f scripts/training_score.gd ]; then
            sed -i 's/TrainingScore/FabTrainingScore/g' scripts/training_score.gd
          fi

          if compgen -G "scripts/*.gd" > /dev/null; then
            sed -i 's/TrainingScore/FabTrainingScore/g' scripts/*.gd
          fi

          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f scripts/sheep.gd

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates

          ANDROID_SOURCE="$(find /tmp/godot-templates -type f -name android_source.zip -print -quit)"
          ANDROID_DEBUG="$(find /tmp/godot-templates -type f -name android_debug.apk -print -quit)"
          ANDROID_RELEASE="$(find /tmp/godot-templates -type f -name android_release.apk -print -quit)"

          test -n "$ANDROID_SOURCE"
          test -n "$ANDROID_DEBUG"
          test -n "$ANDROID_RELEASE"

          cp "$ANDROID_SOURCE" "$TEMPLATE_DIR/android_source.zip"
          cp "$ANDROID_DEBUG" "$TEMPLATE_DIR/android_debug.apk"
          cp "$ANDROID_RELEASE" "$TEMPLATE_DIR/android_release.apk"

      - name: Prepare Android Gradle build template
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip" -d android/build
          test -f android/build/build.gradle || test -f android/build/settings.gradle

      - name: Set valid Android package identifier
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("export_presets.cfg")
          lines = path.read_text(encoding="utf-8").splitlines()

          preset_index = None
          for i, line in enumerate(lines):
              if re.fullmatch(r"\[preset\.\d+\]", line):
                  section_end = next(
                      (j for j in range(i + 1, len(lines)) if lines[j].startswith("[")),
                      len(lines)
                  )
                  section = lines[i:section_end]
                  if any(x.strip() == 'name="Android"' for x in section):
                      preset_index = int(re.search(r"preset\.(\d+)", line).group(1))
                      break

          if preset_index is None:
              raise SystemExit("Android preset not found")

          options_header = f"[preset.{preset_index}.options]"
          try:
              options_start = lines.index(options_header)
          except ValueError:
              raise SystemExit(f"Missing {options_header}")

          options_end = next(
              (j for j in range(options_start + 1, len(lines)) if lines[j].startswith("[")),
              len(lines)
          )

          key = "package/unique_name="
          value = 'package/unique_name="com.fabtontedemouton.fabshearing"'

          existing = next(
              (j for j in range(options_start + 1, options_end) if lines[j].startswith(key)),
              None
          )

          if existing is not None:
              lines[existing] = value
          else:
              lines.insert(options_end, value)

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Android package identifier configured correctly.")
          print("\n".join(lines[options_start:options_end + 1]))
          PY

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FAB-SHEARING.apk
          test -s build/FAB-SHEARING.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAB-SHEARING-APK
          path: build/FAB-SHEARING.apk
          if-no-files-found: error
          
