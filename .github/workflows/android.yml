
name: Build FAB SHEARING Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: FAB SHEARING APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euxo pipefail

          DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DIR" /tmp/godot-templates

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          SOURCE="$(find /tmp/godot-templates -name android_source.zip -print -quit)"
          DEBUG="$(find /tmp/godot-templates -name android_debug.apk -print -quit)"
          RELEASE="$(find /tmp/godot-templates -name android_release.apk -print -quit)"

          test -n "$SOURCE"
          test -n "$DEBUG"
          test -n "$RELEASE"

          cp "$SOURCE" "$DIR/android_source.zip"
          cp "$DEBUG" "$DIR/android_debug.apk"
          cp "$RELEASE" "$DIR/android_release.apk"

      - name: Organize project files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p scenes scripts

          if [ -f main.tscn ]; then
            cp -f main.tscn scenes/main.tscn
          fi

          for file in main.gd sheep.gd player.gd training_score.gd; do
            if [ -f "$file" ]; then
              cp -f "$file" "scripts/$file"
            fi
          done

          if compgen -G "scripts/*.gd" > /dev/null; then
            sed -i 's/TrainingScore/FabTrainingScore/g' scripts/*.gd
          fi

          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f scripts/sheep.gd
          test -f export_presets.cfg

      - name: Configure Android export
        shell: bash
        run: |
          set -euxo pipefail

          # Désactive Gradle : export Android standard
          sed -i \
            's/^gradle_build\/use_gradle_build=.*/gradle_build\/use_gradle_build=false/' \
            export_presets.cfg

          # Identifiant Android valide
          if grep -q '^package/unique_name=' export_presets.cfg; then
            sed -i \
              's|^package/unique_name=.*|package/unique_name="com.fabtontedemouton.fabshearing"|' \
              export_presets.cfg
          else
            sed -i \
              '/^\[preset\.0\.options\]/a package/unique_name="com.fabtontedemouton.fabshearing"' \
              export_presets.cfg
          fi

          grep -E 'gradle_build/use_gradle_build|package/unique_name' export_presets.cfg

      - name: Import Godot project
        run: |
          godot --headless --editor --path . --quit

      - name: Check Godot project
        run: |
          godot --headless --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          godot --headless --verbose --path . \
            --export-debug "Android" build/FAB-SHEARING.apk

          test -s build/FAB-SHEARING.apk
          ls -lh build/FAB-SHEARING.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAB-SHEARING-APK
          path: build/FAB-SHEARING.apk
          if-no-files-found: error
          
