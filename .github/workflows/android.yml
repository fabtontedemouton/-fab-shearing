
name: Build FAB SHEARING Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FAB SHEARING APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Organize Godot files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p scenes scripts

          if [ -f main.tscn ]; then
            cp -f main.tscn scenes/main.tscn
          fi

          for file in main.gd sheep.gd player.gd training_score.gd; do
            if [ -f "$file" ]; then
              cp -f "$file" "scripts/$file"
            fi
          done

          if [ -f scripts/training_score.gd ]; then
            sed -i 's/TrainingScore/FabTrainingScore/g' scripts/training_score.gd
          fi

          if compgen -G "scripts/*.gd" > /dev/null; then
            sed -i 's/TrainingScore/FabTrainingScore/g' scripts/*.gd
          fi

          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f scripts/sheep.gd

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/platforms/android-34"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates

          ANDROID_SOURCE="$(find /tmp/godot-templates -type f -name android_source.zip -print -quit)"
          ANDROID_DEBUG="$(find /tmp/godot-templates -type f -name android_debug.apk -print -quit)"
          ANDROID_RELEASE="$(find /tmp/godot-templates -type f -name android_release.apk -print -quit)"

          test -n "$ANDROID_SOURCE"
          test -n "$ANDROID_DEBUG"
          test -n "$ANDROID_RELEASE"

          cp "$ANDROID_SOURCE" "$TEMPLATE_DIR/android_source.zip"
          cp "$ANDROID_DEBUG" "$TEMPLATE_DIR/android_debug.apk"
          cp "$ANDROID_RELEASE" "$TEMPLATE_DIR/android_release.apk"
          ls -lh "$TEMPLATE_DIR"

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair -v \
            -keystore "$HOME/.config/godot/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.config/godot/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          java -version
          adb version
          test -f "$HOME/.config/godot/debug.keystore"

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("export_presets.cfg")
          lines = path.read_text(encoding="utf-8").splitlines()

          preset_start = None
          preset_number = None

          for i, line in enumerate(lines):
              match = re.fullmatch(r"\[preset\.(\d+)\]", line)
              if not match:
                  continue

              end = next(
                  (j for j in range(i + 1, len(lines)) if lines[j].startswith("[")),
                  len(lines)
              )
              section = lines[i:end]

              if any(x.strip() == 'name="Android"' for x in section):
                  preset_start = i
                  preset_number = match.group(1)
                  break

          if preset_start is None:
              raise SystemExit('No export preset named "Android" found.')

          options_header = f"[preset.{preset_number}.options]"

          try:
              options_start = lines.index(options_header)
          except ValueError:
              lines.append(options_header)
              options_start = len(lines) - 1

          options_end = next(
              (j for j in range(options_start + 1, len(lines)) if lines[j].startswith("[")),
              len(lines)
          )

          settings = {
              "package/unique_name": '"com.fabtontedemouton.fabshearing"',
              "package/name": '"FAB SHEARING"',
              "version/code": "1",
              "version/name": '"1.0"',
              "gradle_build/use_gradle_build": "false",
          }

          for key, value in settings.items():
              prefix = key + "="
              found = next(
                  (j for j in range(options_start + 1, options_end) if lines[j].startswith(prefix)),
                  None
              )
              setting = prefix + value

              if found is None:
                  lines.insert(options_end, setting)
                  options_end += 1
              else:
                  lines[found] = setting

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Android preset configured:")
          print("\n".join(lines[options_start:options_end]))
          PY

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/FAB-SHEARING.apk
          test -s build/FAB-SHEARING.apk
          ls -lh build/FAB-SHEARING.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAB-SHEARING-APK
          path: build/FAB-SHEARING.apk
          if-no-files-found: error
          
