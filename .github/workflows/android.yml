
name: FAB SHEARING APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FAB SHEARING Android
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERREUR : sdkmanager introuvable"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot Android templates
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.3.stable"
          DEST="$HOME/.local/share/godot/export_templates/$VERSION"

          mkdir -p "$DEST" /tmp/godot-templates

          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz

          unzip -q /tmp/godot-templates.tpz \
            -d /tmp/godot-templates

          SOURCE="$(find /tmp/godot-templates -name android_source.zip -print -quit)"
          DEBUG="$(find /tmp/godot-templates -name android_debug.apk -print -quit)"
          RELEASE="$(find /tmp/godot-templates -name android_release.apk -print -quit)"

          test -s "$SOURCE"
          test -s "$DEBUG"
          test -s "$RELEASE"

          install -m 0644 "$SOURCE" "$DEST/android_source.zip"
          install -m 0644 "$DEBUG" "$DEST/android_debug.apk"
          install -m 0644 "$RELEASE" "$DEST/android_release.apk"

          printf '%s' "$VERSION" > "$DEST/version.txt"

      - name: Check project structure
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            project.godot \
            export_presets.cfg \
            main.tscn \
            main.gd \
            sheep.gd \
            player.gd \
            training_score.gd
          do
            test -s "$file" || {
              echo "FICHIER MANQUANT : $file"
              exit 1
            }
          done

          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot

          echo "Structure et compression Android vérifiées."

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

          test -s "$HOME/.android/debug.keystore"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Verify Android preset
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'name="Android"' export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg
          grep -q 'package/unique_name=' export_presets.cfg

          echo "Preset Android valide."

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --editor \
            --path . \
            --import \
            --quit

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --path . \
            --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build

          echo "Début export Android FAB SHEARING"

          godot --headless --verbose \
            --path . \
            --export-debug "Android" \
            build/FAB-SHEARING.apk \
            2>&1 | tee build/export.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo "ECHEC EXPORT ANDROID"
            echo "DIAGNOSTIC COMPLET :"

            grep -in -E \
              "error|invalid|missing|required|keystore|sdk|template|android|etc2|astc" \
              build/export.log | tail -150 || true

            exit "$RESULT"
          fi

          if [ ! -s build/FAB-SHEARING.apk ]; then
            echo "ERREUR : APK absent ou vide"
            exit 1
          fi

          echo "APK FAB SHEARING GENERE AVEC SUCCES"
          ls -lh build/FAB-SHEARING.apk

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAB-SHEARING-APK
          path: |
            build/FAB-SHEARING.apk
            build/export.log
          if-no-files-found: warn
          retention-days: 14
          
