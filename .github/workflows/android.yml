
name: Build FAB SHEARING Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FAB SHEARING APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Organize project files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p scenes scripts

          if [ -f main.tscn ]; then
            cp -f main.tscn scenes/main.tscn
          fi

          for file in main.gd sheep.gd player.gd training_score.gd; do
            if [ -f "$file" ]; then
              cp -f "$file" "scripts/$file"
            fi
          done

          if [ -f scripts/training_score.gd ]; then
            sed -i 's/TrainingScore/FabTrainingScore/g' scripts/training_score.gd
          fi

          if compgen -G "scripts/*.gd" > /dev/null; then
            sed -i 's/TrainingScore/FabTrainingScore/g' scripts/*.gd
          fi

          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f scripts/sheep.gd

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313"

          test -d "$SDK/platforms/android-34"
          test -d "$SDK/build-tools/34.0.0"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euxo pipefail

          DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DIR" /tmp/godot-templates

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          SOURCE="$(find /tmp/godot-templates -name android_source.zip -print -quit)"
          DEBUG="$(find /tmp/godot-templates -name android_debug.apk -print -quit)"
          RELEASE="$(find /tmp/godot-templates -name android_release.apk -print -quit)"

          test -n "$SOURCE"
          test -n "$DEBUG"
          test -n "$RELEASE"

          cp "$SOURCE" "$DIR/android_source.zip"
          cp "$DEBUG" "$DIR/android_debug.apk"
          cp "$RELEASE" "$DIR/android_release.apk"

          ls -lh "$DIR"

      - name: Configure Android signing
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair -v \
            -keystore "$HOME/.config/godot/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.config/godot/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Verify Android preset
        shell: bash
        run: |
          set -euxo pipefail

          grep -F 'name="Android"' export_presets.cfg
          grep -F 'gradle_build/use_gradle_build=true' export_presets.cfg
          grep -F 'package/unique_name=' export_presets.cfg

          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip"

      - name: Import Godot project
        run: |
          godot --headless --editor --path . --quit

      - name: Install Android build template
        run: |
          set -euxo pipefail
          godot --headless --path . --install-android-build-template
          test -f android/build/build.gradle

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          godot --headless --verbose --path . \
            --export-debug "Android" build/FAB-SHEARING.apk

          test -s build/FAB-SHEARING.apk
          ls -lh build/FAB-SHEARING.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAB-SHEARING-APK
          path: build/FAB-SHEARING.apk
          if-no-files-found: error
          
